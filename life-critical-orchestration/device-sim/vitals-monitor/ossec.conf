<ossec_config>
  <client>
    <server>
      <address>host.docker.internal</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>host.docker.internal</manager_address>
      <port>1515</port>
      <agent_name>iomt-vitals-monitor</agent_name>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- File Integrity Monitoring: the "patient records" the ransomware scenario
       (Workstream B) will mass-modify. realtime=yes so changes alert in seconds. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <directories realtime="yes" check_all="yes" report_changes="yes">/medical-data</directories>
    <skip_nfs>yes</skip_nfs>
  </syscheck>

  <!-- Auth log for the SSH brute-force scenario (wired up in Workstream B).
       Harmless if the file doesn't exist yet. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
